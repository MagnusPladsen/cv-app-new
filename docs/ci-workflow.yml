name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test

      - run: bunx playwright install --with-deps chromium

      # SKIP_VISUAL because pixel baselines are committed per platform and this
      # runner is Linux. template-signatures.spec.ts asserts the same template
      # regressions structurally and does run here, as do the print tests.
      - run: bun run test:e2e
        env:
          SKIP_VISUAL: '1'

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
